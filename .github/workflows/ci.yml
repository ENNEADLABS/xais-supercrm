name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks

      - name: Scan Git history
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --redact=100 \
            --no-banner \
            --verbose \
            .

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Le repo est standardise sur pnpm (packageManager pin dans package.json).
      # action-setup lit la version depuis package.json — pas besoin de la fixer ici.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-anon-key-for-ci

  # Tests d'intégration RLS / isolation multi-tenant (ADR-0008).
  # Nécessite la stack Supabase complète (GoTrue pour créer les users de test),
  # donc `supabase start` plutôt qu'un simple service Postgres.
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Épinglé : `latest` active la signature JWT asymétrique par défaut et
          # une version de PostgREST qui rejette la clé service_role résolue
          # (→ rôle anon → "permission denied"). 2.98.2 = comportement validé en
          # local. À réévaluer lors d'un upgrade volontaire de la CLI locale.
          version: 2.98.2

      - name: Start Supabase stack
        run: supabase start

      - name: Apply schema + RLS + seed
        run: pnpm run db:reset

      - name: Integration tests (RLS)
        run: pnpm run test:integration
